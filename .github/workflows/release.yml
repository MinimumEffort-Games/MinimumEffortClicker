name: Build and preview release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Test and package (no native input)
        shell: pwsh
        run: ./scripts/Build-Public.ps1 -Zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-x64-unsigned-preview
          path: |
            artifacts/package/*.zip
            artifacts/package/*.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Publish the very bytes the build job tested instead of building a second time.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Windows-x64-unsigned-preview
          path: artifacts/package
      - name: Validate version against the tag
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match the pinned app version.' }
          $package = Join-Path (Get-Location) "artifacts/package/MinimumEffortClicker-$version-win-x64"
          if (!(Test-Path -LiteralPath "$package.zip")) { throw "Expected package $package.zip from the build job." }
          "MEC_PACKAGE=$package" >> $env:GITHUB_ENV
      - name: Publish unsigned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create $env:GITHUB_REF_NAME "$env:MEC_PACKAGE.zip" "$env:MEC_PACKAGE.zip.sha256" --verify-tag --prerelease --title "Minimum Effort Clicker $env:GITHUB_REF_NAME (unsigned preview)" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
